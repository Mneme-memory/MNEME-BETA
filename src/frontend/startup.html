<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mneme is starting</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="startup.css">
</head>
<body>
    <main class="startup-shell" aria-live="polite">
        <canvas id="startupCanvas" class="startup-canvas" width="150" height="160" aria-hidden="true"></canvas>
        <section class="startup-copy">
            <img src="assets/mneme-wordmark.svg" alt="Mneme" class="startup-wordmark">
            <h1 id="startupPhase">Starting Mneme</h1>
            <p id="startupDetail">Preparing the local memory system...</p>
        </section>
    </main>
    <script src="startup.js"></script>
</body>
</html>
